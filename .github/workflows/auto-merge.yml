name: Auto-merge for Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  auto-approve-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Approve and Merge PR
        if: contains(fromJSON('["shariefs19-sthira","reifmusicexpress-code","google-labs-jules"]'), github.event.pull_request.user.login) && !github.event.pull_request.draft && !contains(github.event.pull_request.body, 'HUMAN-REVIEW')
        uses: dependabot/fetch-metadata@v2.2.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          
      - name: Enable Auto-Merge for Allowed Authors
        if: contains(fromJSON('["shariefs19-sthira","reifmusicexpress-code","google-labs-jules"]'), github.event.pull_request.user.login) && !github.event.pull_request.draft && !contains(github.event.pull_request.body, 'HUMAN-REVIEW')
        run: |
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}